<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>1万年前的雨</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; font-family: sans-serif; color: #fff; }
        #title-container { position: absolute; top: 10%; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        h1 { font-size: 3rem; font-weight: 300; letter-spacing: 0.5em; text-shadow: 0 0 20px rgba(0, 150, 255, 0.3); margin: 0; }
        p { font-size: 1rem; color: #888; letter-spacing: 0.2em; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="title-container">
        <h1>1万年前的雨</h1>
        <p>A DROP OF RAIN FROM 10,000 YEARS AGO</p>
    </div>
<div style="position:absolute; bottom:20%; width:100%; text-align:center; z-index: 20;">
    <a href="index.html" style="display:inline-block; padding:15px 50px; background:transparent; color:#00aaff; border:2px solid #00aaff; border-radius:50px; text-decoration:none; font-size:18px; letter-spacing:2px; transition:0.3s;" onmouseover="this.style.background='#00aaff'; this.style.color='#000';" onmouseout="this.style.background='transparent'; this.style.color='#00aaff';">进入记忆</a>
</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 💡 灯光柔和化：把强烈的点光源变成柔和的散光，消除强烈的明暗对比
        const ambientLight = new THREE.AmbientLight(0x88aaff, 0.5); // 冷色调基础环境光
        scene.add(ambientLight);
        
        const pointLight1 = new THREE.PointLight(0x88aaff, 0.8, 50); // 主光调弱
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x334466, 0.5, 50); // 辅助光调弱
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        const group = new THREE.Group();

        // 透明立方体
        const cubeSize = 3.5;
        const cubeGeometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        const cubeMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.03, 
            roughness: 0.1,
            metalness: 0.1,
            side: THREE.DoubleSide // 玻璃盒依然双面渲染
        });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.renderOrder = 2;
        group.add(cube);

        const edges = new THREE.EdgesGeometry(cubeGeometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 }));
        group.add(line);

        // 💧 修复水滴形状
        const points = [];
        for (let i = 0; i <= 10; i++) {
            const angle = (i / 10) * (Math.PI / 2);
            points.push(new THREE.Vector2(Math.sin(angle) * 0.9, -1.3 + 0.9 * (1 - Math.cos(angle))));
        }
        for (let i = 1; i <= 10; i++) {
            const t = i / 10;
            points.push(new THREE.Vector2(0.9 * (1 - t), -0.4 + 1.8 * t));
        }
        const dropGeometry = new THREE.LatheGeometry(points, 32);
        
        // 🌟 核心修复：深海幽暗蓝 + 消除色差
        const dropMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x0a2a4a,          // 真正的深海暗蓝
            transparent: true,
            opacity: 0.95,             // 实体感
            roughness: 0.05,           // 表面光滑
            metalness: 0.1,
            clearcoat: 1.0,            // 清漆层
            clearcoatRoughness: 0.1,
            emissive: 0x001122,        // 极弱的微光
            emissiveIntensity: 0.3,
            side: THREE.FrontSide      // 关键！改为单面渲染，彻底消除内部重叠产生的色差接缝
        });
        
        const raindrop = new THREE.Mesh(dropGeometry, dropMaterial);
        raindrop.position.set(0, 0, 0);
        raindrop.renderOrder = 1; 
        group.add(raindrop);

        scene.add(group);

        // 鼠标交互
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            targetRotationY = Math.max(-1.5, Math.min(1.5, mouseX * Math.PI * 0.6));
            targetRotationX = Math.max(-1.0, Math.min(1.0, mouseY * Math.PI * 0.4));
        });

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += (targetRotationY - group.rotation.y) * 0.08;
            group.rotation.x += (targetRotationX - group.rotation.x) * 0.08;

            const time = Date.now() * 0.001;
            raindrop.position.y = Math.sin(time * 2) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
